# Alembic: миграции схемы discord_prifiler.
# sqlalchemy.url задаётся в app/migrations/env.py из DATABASE_URL.

[alembic]
script_location = %(here)s/app/migrations
prepend_sys_path = .
version_path_separator = os

# шаблон имени ревизии: <rev>-<slug>.py
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
